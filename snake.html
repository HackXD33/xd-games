<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الثعبان</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- إضافة أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- إضافة مكتبة Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer onload="console.log('Google Identity Services script loaded')"></script>
    <!-- إضافة ملف المصادقة الموحد -->
    <script src="auth.js"></script>
    <script>
        // التأكد من تحميل مكتبة جوجل قبل تهيئتها
        window.onload = function() {
            // التحقق من تحميل مكتبة جوجل
            if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
                console.log('Google Identity Services loaded successfully');
            } else {
                console.error('Google Identity Services not loaded');
                // إعادة تحميل الصفحة بعد فترة قصيرة
                setTimeout(function() {
                    window.location.reload();
                }, 2000);
            }
        };
    </script>
</head>
<body>
    <div class="game-container">
        <header>
            <h1>xd game</h1>
            <div class="games-nav">
                <a href="index.html" class="game-link">لعبة الفقاعات</a>
                <a href="snake.html" class="game-link active">لعبة الثعبان</a>
            </div>
            <div class="game-info">
                <div class="score">النقاط: <span id="score">0</span></div>
                <div class="high-score">أفضل نقاط: <span id="high-score">0</span></div>
                <div class="level">المستوى: <span id="level">1</span></div>
            </div>
            <div class="controls">
                <button id="sound-toggle" class="control-btn"><i class="fas fa-volume-up"></i></button>
                <button id="pause-btn" class="control-btn"><i class="fas fa-pause"></i></button>
                <div class="auth-container">
                    <div id="user-info" class="user-info" style="display: none;">
                        <img id="user-photo" class="user-photo" src="" alt="User Photo">
                        <span id="user-name" class="user-name"></span>
                        <button id="sign-out-btn" class="sign-out-btn">تسجيل الخروج</button>
                    </div>

                    <div id="g_id_onload"
                         data-client_id="YOUR_CLIENT_ID.apps.googleusercontent.com"
                         data-callback="handleSignIn"
                         data-auto_prompt="true">
                    </div>

                    <div id="sign-in-btn" class="g_id_signin"
                         data-type="standard">
                    </div>

                    <button id="custom-signin-btn" class="custom-google-signin" tabindex="0">
                        <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18px" height="18px">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        <span>تسجيل الدخول بحساب جوجل</span>
                    </button>
                </div>
            </div>
        </header>

        <main>
            <div id="game-area" class="snake-game-area">
                <div id="start-screen" class="start-screen">
                    <h2>لعبة الثعبان</h2>
                    <p>استخدم مفاتيح الأسهم للتحكم في الثعبان</p>
                    <p>اجمع الطعام لتنمو وتزيد نقاطك</p>
                    <p>تجنب الاصطدام بالجدران أو بجسمك</p>
                    <button id="start-btn" class="mode-btn">ابدأ اللعب</button>
                </div>

                <canvas id="snake-canvas" style="display: none;"></canvas>

                <div id="game-over" class="game-over" style="display: none;">
                    <h2>انتهت اللعبة!</h2>
                    <p>نقاطك النهائية: <span id="final-score">0</span></p>
                    <p>المستوى الذي وصلت إليه: <span id="final-level">1</span></p>
                    <button id="restart-btn">إعادة اللعب</button>
                    <button id="menu-btn">العودة للقائمة</button>
                </div>

                <div id="pause-screen" class="pause-screen" style="display: none;">
                    <h2>اللعبة موقفة</h2>
                    <button id="resume-btn" class="mode-btn">استئناف اللعب</button>
                    <button id="quit-btn" class="mode-btn">إنهاء اللعبة</button>
                </div>
            </div>
        </main>
    </div>

    <script src="snake.js"></script>
</body>
</html>
